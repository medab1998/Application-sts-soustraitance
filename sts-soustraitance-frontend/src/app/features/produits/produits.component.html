<h1>Produits</h1>

<div class="alert alert-danger" *ngIf="errorMessage">{{ errorMessage }}</div>

<div class="panel">
  <div class="panel-header">
    <h3 style="margin:0;">Catalogue des produits</h3>
    <button class="btn btn-primary" (click)="openCreateForm()">+ Nouveau produit</button>
  </div>

  <form *ngIf="showForm" [formGroup]="form" (ngSubmit)="submit()" class="form-grid" style="margin-bottom: 1.5rem; padding-bottom: 1.5rem; border-bottom: 1px solid var(--slate-100);">
    <div class="form-field">
      <label>Designation</label>
      <input type="text" formControlName="designation">
    </div>
    <div class="form-field">
      <label>Prix unitaire (TND)</label>
      <input type="number" step="0.01" formControlName="prixUnitaire">
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary" [disabled]="form.invalid">Enregistrer</button>
      <button type="button" class="btn btn-secondary" (click)="cancel()">Annuler</button>
    </div>
  </form>

  <table class="data-table">
    <thead><tr><th>ID</th><th>Designation</th><th>Prix unitaire</th><th></th></tr></thead>
    <tbody>
      <tr *ngIf="loading"><td colspan="4" class="empty-row">Chargement...</td></tr>
      <tr *ngIf="!loading && items.length === 0"><td colspan="4" class="empty-row">Aucun produit enregistre.</td></tr>
      <tr *ngFor="let item of items">
        <td class="num">{{ item.idProduit }}</td>
        <td>{{ item.designation }}</td>
        <td class="num">{{ item.prixUnitaire | number:'1.2-2' }} TND</td>
        <td class="actions">
          <button class="btn btn-danger btn-sm" (click)="remove(item.idProduit!)">Supprimer</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
