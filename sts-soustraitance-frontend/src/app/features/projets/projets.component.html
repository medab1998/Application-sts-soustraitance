<h1>Projets</h1>

<div class="alert alert-danger" *ngIf="errorMessage">{{ errorMessage }}</div>

<div class="panel">
  <div class="panel-header">
    <h3 style="margin:0;">Liste des projets</h3>
    <button class="btn btn-primary" (click)="openCreateForm()">+ Nouveau projet</button>
  </div>

  <form *ngIf="showForm" [formGroup]="form" (ngSubmit)="submit()" class="form-grid" style="margin-bottom: 1.5rem; padding-bottom: 1.5rem; border-bottom: 1px solid var(--slate-100);">
    <div class="form-field">
      <label>Nom du projet</label>
      <input type="text" formControlName="nom">
    </div>
    <div class="form-field">
      <label>Client</label>
      <input type="text" formControlName="client">
    </div>
    <div class="form-field">
      <label>Date debut</label>
      <input type="date" formControlName="dateDebut">
    </div>
    <div class="form-field">
      <label>Date fin</label>
      <input type="date" formControlName="dateFin">
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary" [disabled]="form.invalid">Enregistrer</button>
      <button type="button" class="btn btn-secondary" (click)="cancel()">Annuler</button>
    </div>
  </form>

  <table class="data-table">
    <thead>
      <tr><th>ID</th><th>Nom</th><th>Client</th><th>Debut</th><th>Fin</th><th></th></tr>
    </thead>
    <tbody>
      <tr *ngIf="loading"><td colspan="6" class="empty-row">Chargement...</td></tr>
      <tr *ngIf="!loading && items.length === 0"><td colspan="6" class="empty-row">Aucun projet enregistre.</td></tr>
      <tr *ngFor="let item of items">
        <td class="num">{{ item.idProjet }}</td>
        <td>{{ item.nom }}</td>
        <td>{{ item.client || '—' }}</td>
        <td>{{ item.dateDebut || '—' }}</td>
        <td>{{ item.dateFin || '—' }}</td>
        <td class="actions">
          <button class="btn btn-danger btn-sm" (click)="remove(item.idProjet!)">Supprimer</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
