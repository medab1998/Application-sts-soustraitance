# ===================== Base de donnees PostgreSQL (par defaut) =====================
spring.datasource.url=jdbc:postgresql://localhost:5432/sts_soustraitance
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=sts_user
spring.datasource.password=sts_password

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# update : cree/adapte les tables automatiquement au demarrage (pratique en developpement)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

# ===================== JWT =====================
# Cle secrete (a changer en production, min. 256 bits pour HS256)
jwt.secret=STS_LINK_CLE_SECRETE_A_CHANGER_EN_PRODUCTION_2026_XYZ
# Duree de validite du token en millisecondes (ici 24h)
jwt.expiration=86400000
